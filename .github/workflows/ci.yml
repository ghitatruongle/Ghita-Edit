name: Ghita Edit CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-version-consistency:
    name: Version Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version.dart matches pubspec.yaml
        run: |
          DART_MAJOR=$(sed -n 's/.*kMajorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart)
          DART_MINOR=$(sed -n 's/.*kMinorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart)
          DART_PATCH=$(sed -n 's/.*kPatchVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart)
          DART_BUILD=$(sed -n 's/.*kBuildNumber = \([0-9]*\).*/\1/p' lib/src/core/version.dart)
          PUBSPEC_VER=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '[:space:]')
          EXPECTED="$DART_MAJOR.$DART_MINOR.$DART_PATCH+$DART_BUILD"
          if [ "$PUBSPEC_VER" != "$EXPECTED" ]; then
            echo "Version mismatch: pubspec=$PUBSPEC_VER vs version.dart=$EXPECTED"
            exit 1
          fi
          echo "Version consistent: $EXPECTED"

      - name: Check C API version string consistency
        run: |
          DART_VER=$(sed -n 's/.*kMajorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart).$(sed -n 's/.*kMinorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart).$(sed -n 's/.*kPatchVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart)
          C_API_VER=$(sed -n 's/.*v\([0-9.]*\) (C++\/Flutter).*/\1/p' native_engine/src/ghita_c_api.cpp)
          if [ "$DART_VER" != "$C_API_VER" ]; then
            echo "C API version mismatch: Dart=$DART_VER vs C=$C_API_VER"
            exit 1
          fi
          echo "C API version consistent: $C_API_VER"

      - name: Check CMake project version
        run: |
          DART_VER=$(sed -n 's/.*kMajorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart).$(sed -n 's/.*kMinorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart).$(sed -n 's/.*kPatchVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart)
          CMAKE_VER=$(sed -n 's/.*VERSION \([0-9.]*\) .*/\1/p' native_engine/CMakeLists.txt)
          if [ "$DART_VER" != "$CMAKE_VER" ]; then
            echo "CMake version mismatch: Dart=$DART_VER vs CMake=$CMAKE_VER"
            exit 1
          fi
          echo "CMake version consistent: $CMAKE_VER"

      # v1.1.0 (PLAN 1.1/B18): The code shipped fixes v1.0.1-1.0.3 without ever
      # bumping the version or the changelog, so the drift was invisible to the
      # four-way check above. Gate the CHANGELOG on the current version.
      - name: Check CHANGELOG has an entry for the current version
        run: |
          DART_VER=$(sed -n 's/.*kMajorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart).$(sed -n 's/.*kMinorVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart).$(sed -n 's/.*kPatchVersion = \([0-9]*\).*/\1/p' lib/src/core/version.dart)
          if ! grep -q "^## v$DART_VER" CHANGELOG.md; then
            echo "CHANGELOG is missing an entry for v$DART_VER"
            exit 1
          fi
          echo "CHANGELOG entry present: v$DART_VER"

  flutter-analyze-and-test:
    name: Flutter Linting & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # v1.0.0c: align with the development SDK (local: 3.44.2). The
          # pinned 3.27.x lacked SwitchListTile.activeThumbColor /
          # Color.toARGB32, so the analyzer failed on every CI run.
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project (Strict Linter Check)
        run: flutter analyze --fatal-infos

      - name: Build C++ Native Engine (Linux)
        run: |
          cmake -B native_engine/build -S native_engine -DCMAKE_BUILD_TYPE=Release
          cmake --build native_engine/build --config Release

      - name: Run Native C++ Self Test
        run: ./native_engine/build/native_engine_test

      - name: Run Flutter Test Suite
        run: flutter test --coverage

  build-native-engine-windows:
    name: Build C++ Native Engine (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B native_engine/build -S native_engine -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Shared Library
        run: cmake --build native_engine/build --config Release

  engine-smoke-test-windows:
    name: Engine Smoke Test (Windows Release)
    # v1.0.1: Builds the full Windows Release app and runs the real-engine
    # smoke test (scripts/run_engine_smoke_test.sh) — verifies the engine DLL
    # loads/initializes, the FFmpeg runtime DLLs are bundled when the engine
    # needs them (the silent Demo-Mode regression), and the log is clean.
    # Note: windows-latest has no FFmpeg dev install, so the engine builds
    # synthetic-only there and the MP3 import/playback portion is skipped;
    # run the script locally (or on a runner with FFmpeg) for the full path.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          # v1.0.0c: align with the development SDK (see analyze job).
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Run Engine Smoke Test
        shell: bash
        run: bash scripts/run_engine_smoke_test.sh

      # v1.1.0 (PLAN 3.12): export matrix — MP4/H.264, MP4/H.265, MP4/VP9,
      # GIF (skip: pal8 encoder limitation), MP3, MOV/H.264 — each verified
      # with ffprobe (codec/streams/duration/size). Fails loudly on wrong
      # output; skips formats whose encoder the engine cannot use yet.
      - name: Verify Export Matrix (ffprobe)
        shell: bash
        run: |
          # Generate the test media the matrix exports.
          ffmpeg -y -f lavfi -i testsrc2=size=320x240:rate=30:duration=1.2 \
            -f lavfi -i sine=frequency=440:duration=1.2 -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -shortest -movflags +faststart \
            build/windows/x64/runner/Release/matrix_media.mp4
          bash scripts/verify_export_matrix.sh \
            --dll build/windows/x64/runner/Release/ghita_engine.dll \
            --media build/windows/x64/runner/Release/matrix_media.mp4 \
            --out build/export_matrix_ci

  build-native-engine-linux:
    name: Build C++ Native Engine (Linux GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (Linux)
        run: sudo apt-get update && sudo apt-get install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

      - name: Configure CMake
        run: cmake -B native_engine/build -S native_engine -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Shared Library
        run: cmake --build native_engine/build --config Release

  build-native-engine-macos:
    name: Build C++ Native Engine (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg (Homebrew)
        # v1.0.0d (CI fix): the macOS runner ships an untrusted 'aws/tap',
        # so `brew install ffmpeg` fails with "taps are not trusted".
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ffmpeg pkg-config

      - name: Configure CMake
        run: cmake -B native_engine/build -S native_engine -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build C++ Shared Library
        run: cmake --build native_engine/build --config Release -j$(sysctl -n hw.ncpu)

      - name: Run Native C++ Self Test
        run: ./native_engine/build/native_engine_test
