name: ghita_edit
description: Cross-platform multimedia editor prototype with native C++ engine via Dart FFI.
publish_to: 'none'

# Version is derived from lib/src/core/version.dart — do not edit directly!
# Generated by: flutter pub run build_runner build --release
version: 1.0.0+0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.1.2
  file_picker: ^9.0.7
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  # v1.0.0b (CI fix): keep record on the 6.x line — record 7.x requires
  # Dart >= 3.12, which breaks pub resolution on the CI Flutter 3.27 toolchain
  # (Dart 3.6). The voiceover API used (AudioRecorder/RecordConfig/start/stop)
  # is identical in 6.x.
  record: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

